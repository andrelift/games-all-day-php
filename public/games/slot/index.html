<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Games All Day</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="slot">
      <div id="title">Games All Day</div>
      <p id="status">Play for fun. Virtual credits only.</p>
      <div id="reels">
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
      </div>
      <div id="controls">
        <p id="credits">Credits <span id="credit-value">500</span></p>
        <button type="button" id="spin">SPIN</button>
        <label>
          <input type="checkbox" name="autoplay" id="autoplay" />
          Autoplay
        </label>
      </div>
    </div>
    <script type="module" src="./slot.js"></script>
  </body>
</html>
